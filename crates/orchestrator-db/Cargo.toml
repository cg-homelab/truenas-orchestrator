[package]
name = "orchestrator-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "macros", "migrate", "chrono", "uuid"] }
thiserror = "2.0.21"
uuid = "1.26.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
