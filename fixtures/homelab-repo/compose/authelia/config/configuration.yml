theme: dark
log:
  level: "info"

server:
  endpoints:
    authz:
      forward-auth:
        implementation: "ForwardAuth"

storage:
  postgres:
    address: "tcp://db-pg:5432"
    servers: []
    database: "authelia"
    schema: "public"
    username: "authelia"
    timeout: "5s"

password_policy:
  standard:
    enabled: false
    min_length: 8
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false
  zxcvbn:
    enabled: false
    min_score: 3

session:
  cookies:
    - domain: "example.com"
      authelia_url: "https://auth.example.com"
      default_redirection_url: "https://dashboard.example.com"

authentication_backend:
  refresh_interval: "5m"
  password_reset:
    disable: false
  password_change:
    disable: false
  file:
    path: "/config/users.yml"
    watch: false
    search:
      email: true
      case_insensitive: false
    extra_attributes:
      extra_example:
        multi_valued: false
        value_type: "string"
    password:
      algorithm: "argon2"
      argon2:
        variant: "argon2id"
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: "deny"
  rules:
    - domain: "*.example.com"
      policy: "one_factor"
      subject:
        - ["group:admins"]

notifier:
  disable_startup_check: false
  filesystem:
    filename: "/config/notifications.txt"
