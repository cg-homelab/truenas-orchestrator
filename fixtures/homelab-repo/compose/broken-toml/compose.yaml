services:
  broken-toml:
    container_name: "${SERVICE_NAME}"
    image: docker.io/library/alpine:3.22
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks:
      - home
    env_file:
      - ${HOMELAB_STORAGE}/compose/.global.env
      - ${HOMELAB_STORAGE}/compose/broken-toml/.env

networks:
  home:
    external: true
