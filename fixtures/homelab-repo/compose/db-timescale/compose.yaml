services:
  db-timescale:
    container_name: "${SERVICE_NAME}"
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    # shm_size: 2048mb
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks: databases
    env_file:
      - ${HOMELAB_STORAGE}/compose/.global.env
      - ${HOMELAB_STORAGE}/compose/db-timescale/.env
    environment:
      PGDATA: /pgdata
    # ports:
    #   - "5434:5432"
    volumes:
      - /mnt/fast/databases/timescale:/pgdata
      - ${DATABASE_STORAGE}/timescale:/pgdata

networks:
  databases:
    external: true
