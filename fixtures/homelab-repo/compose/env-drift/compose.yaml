services:
  env-drift:
    container_name: "${SERVICE_NAME}"
    image: docker.io/library/alpine:3.22
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks:
      - home
    env_file:
      - ${HOMELAB_STORAGE}/compose/.global.env
      - ${HOMELAB_STORAGE}/compose/env-drift/.env
    environment:
      GREETING: ${GREETING}

networks:
  home:
    external: true
